<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título e descrição vêm de src/i18n/pt-BR.json (plugin i18nHtml em vite.config.ts). -->
    <meta name="description" content="%APP_DESCRIPTION%" />
    <title>%APP_NAME%</title>
    <!-- Cor da barra do sistema: o script abaixo e src/ui/theme/theme.ts a mantêm igual ao fundo do tema. -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- Aplica o tema salvo antes do primeiro desenho, para não piscar (src/ui/theme/theme.ts). -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('repete-habito:tema') || '{}');
        var pref = saved.state && saved.state.preference;
        if (pref !== 'light' && pref !== 'dark') pref = 'system';
        var dark =
          pref === 'dark' ||
          (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#1a1c19' : '#ffffff';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
