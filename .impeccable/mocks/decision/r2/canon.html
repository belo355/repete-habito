<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=390" />
    <title>Padrão da categoria</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 390px;
        height: 844px;
        overflow: hidden;
        background: #fff;
        color: #111827;
        font-family: -apple-system, system-ui, sans-serif;
      }
      .top {
        padding: 24px 20px 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h1 {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .d {
        font-size: 14px;
        color: #6b7280;
      }
      .ring {
        margin: 12px auto 8px;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: conic-gradient(#22c55e 0 80%, #f3f4f6 0);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ring div {
        width: 144px;
        height: 144px;
        border-radius: 50%;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .ring b {
        font-size: 40px;
      }
      .ring span {
        font-size: 13px;
        color: #6b7280;
      }
      .card {
        margin: 10px 16px;
        background: #f3f4f6;
        border-radius: 16px;
        padding: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 72px;
      }
      .ic {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: #fff;
      }
      .tx {
        flex: 1;
      }
      .nm {
        font-weight: 700;
        font-size: 17px;
      }
      .ap {
        font-size: 13px;
        color: #6b7280;
      }
      .ck {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2.5px solid #9ca3af;
      }
      .ck.on {
        background: #22c55e;
        border-color: #22c55e;
      }
      nav {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 76px;
        border-top: 1px solid #e5e7eb;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        font-size: 12px;
        color: #6b7280;
      }
      nav a {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      nav a.on {
        color: #22c55e;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div>
        <p class="d">Domingo, 25 out</p>
        <h1>Hoje</h1>
      </div>
    </div>
    <div class="ring">
      <div><b>2/3</b><span>concluídas</span></div>
    </div>
    <div class="card">
      <span class="ic"></span>
      <div class="tx">
        <p class="nm">Caminhada</p>
        <p class="ap">32 min</p>
      </div>
      <span class="ck on"></span>
    </div>
    <div class="card">
      <span class="ic"></span>
      <div class="tx">
        <p class="nm">Alongamento</p>
        <p class="ap">10 min</p>
      </div>
      <span class="ck"></span>
    </div>
    <div class="card">
      <span class="ic"></span>
      <div class="tx">
        <p class="nm">Flexões</p>
        <p class="ap">Folga</p>
      </div>
      <span class="ck on"></span>
    </div>
    <nav><a class="on">Hoje</a><a>Hábitos</a><a>Estatísticas</a><a>Ajustes</a></nav>
  </body>
</html>
