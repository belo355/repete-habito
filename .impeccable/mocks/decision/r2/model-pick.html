<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=390" />
    <title>Calçadão</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pedra: #16181a;
        --branco: #f7f7f5;
        --mar: #0a6fb8;
        --sol: #ffcf3f;
        --cinza: #e4e6e2;
        --apoio: #575b57;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 390px;
        height: 844px;
        overflow: hidden;
        background: var(--branco);
        color: var(--pedra);
        font-family: 'Work Sans', system-ui, sans-serif;
      }
      .top {
        padding: 22px 20px 0;
      }
      .date {
        font-weight: 700;
        font-size: 15px;
        color: var(--apoio);
      }
      h1 {
        font-family: 'Archivo Black';
        font-size: 52px;
        line-height: 0.95;
        letter-spacing: -0.03em;
        margin-top: 8px;
      }
      .sum {
        font-weight: 700;
        font-size: 17px;
        margin-top: 8px;
      }
      .calc {
        margin-top: 18px;
        background: var(--branco);
        padding: 0 0 4px;
      }
      .calc svg {
        display: block;
        width: 390px;
        height: 150px;
      }
      .leg {
        display: flex;
        justify-content: space-between;
        padding: 6px 20px 0;
        font-size: 12px;
        font-weight: 700;
        color: var(--apoio);
      }
      .list {
        margin-top: 10px;
      }
      .it {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-top: 2px solid var(--cinza);
        min-height: 80px;
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        transform: rotate(45deg);
      }
      .tx {
        flex: 1;
      }
      .nm {
        font-weight: 700;
        font-size: 19px;
      }
      .ap {
        font-size: 14px;
        color: var(--apoio);
      }
      .btn {
        height: 48px;
        min-width: 112px;
        border-radius: 999px;
        border: 2px solid var(--pedra);
        font-weight: 700;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--branco);
      }
      .btn.done {
        background: var(--pedra);
        color: var(--branco);
      }
      .btn.fol {
        border-color: var(--mar);
        color: var(--mar);
      }
      nav {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 76px;
        background: var(--pedra);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        padding: 10px 12px 14px;
        gap: 8px;
      }
      nav a {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        color: #c9ccc6;
        border-radius: 999px;
      }
      nav a.on {
        background: var(--sol);
        color: var(--pedra);
      }
    </style>
  </head>
  <body>
    <header class="top">
      <p class="date">Domingo, 25 de outubro</p>
      <h1>Hoje</h1>
      <p class="sum">4 pedras nesta semana · 5 planejadas</p>
    </header>
    <div class="calc" aria-label="Calçada da semana: cada pedra é um dia ativo">
      <svg viewBox="0 0 390 150" xmlns="http://www.w3.org/2000/svg">
        <rect width="390" height="150" fill="#f7f7f5" />
        <path d="M0 70 Q48 20 97 70 T195 70 T292 70 T390 70 L390 150 L0 150Z" fill="#16181a" />
        <path d="M0 100 Q48 50 97 100 T195 100 T292 100 T390 100 L390 150 L0 150Z" fill="#f7f7f5" />
        <path d="M0 128 Q48 78 97 128 T195 128 T292 128 T390 128 L390 150 L0 150Z" fill="#16181a" />
        <g stroke="#f7f7f5" stroke-width="2" fill="none" opacity=".35">
          <path d="M0 40 H390 M0 85 H390 M0 115 H390" />
          <path
            d="M30 0 V150 M70 0 V150 M110 0 V150 M150 0 V150 M190 0 V150 M230 0 V150 M270 0 V150 M310 0 V150 M350 0 V150"
          />
        </g>
        <g>
          <rect
            x="34"
            y="42"
            width="30"
            height="30"
            rx="5"
            fill="#ffcf3f"
            stroke="#16181a"
            stroke-width="3"
          />
          <rect
            x="114"
            y="42"
            width="30"
            height="30"
            rx="5"
            fill="#ffcf3f"
            stroke="#16181a"
            stroke-width="3"
          />
          <rect
            x="194"
            y="42"
            width="30"
            height="30"
            rx="5"
            fill="#ffcf3f"
            stroke="#16181a"
            stroke-width="3"
          />
          <rect
            x="234"
            y="42"
            width="30"
            height="30"
            rx="5"
            fill="#0a6fb8"
            stroke="#16181a"
            stroke-width="3"
          />
          <rect
            x="274"
            y="42"
            width="30"
            height="30"
            rx="5"
            fill="#ffcf3f"
            stroke="#16181a"
            stroke-width="3"
          />
          <rect
            x="314"
            y="42"
            width="30"
            height="30"
            rx="5"
            fill="none"
            stroke="#16181a"
            stroke-width="3"
            stroke-dasharray="5 4"
          />
        </g>
      </svg>
      <div class="leg">
        <span>seg</span><span>ter</span><span>qua</span><span>qui</span><span>sex</span
        ><span>sáb</span><span>dom</span>
      </div>
    </div>
    <div class="list">
      <div class="it">
        <span class="dot" style="background: var(--sol); outline: 2px solid var(--pedra)"></span>
        <div class="tx">
          <p class="nm">Caminhada</p>
          <p class="ap">32 min · meta 20</p>
        </div>
        <span class="btn done">Feito</span>
      </div>
      <div class="it">
        <span class="dot" style="background: var(--pedra)"></span>
        <div class="tx">
          <p class="nm">Alongamento</p>
          <p class="ap">Todo dia</p>
        </div>
        <span class="btn">Marcar</span>
      </div>
      <div class="it">
        <span class="dot" style="background: var(--mar)"></span>
        <div class="tx">
          <p class="nm">Flexões</p>
          <p class="ap">Folga hoje</p>
        </div>
        <span class="btn fol">Folga</span>
      </div>
    </div>
    <nav><a class="on">Hoje</a><a>Calçada</a><a>Ajustes</a></nav>
  </body>
</html>
