<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=390" />
    <title>Quadro do dia</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Archivo:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --azul: #0b1f3a;
        --amb: #f2a900;
        --fd: #e9edf2;
        --vd: #1f7a4d;
        --apoio: #4f5b6b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 390px;
        height: 844px;
        overflow: hidden;
        background: #fff;
        color: var(--azul);
        font-family: Archivo, system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .top {
        padding: 22px 20px 14px;
      }
      .date {
        font-weight: 700;
        font-size: 15px;
        color: var(--apoio);
      }
      h1 {
        font-weight: 800;
        font-size: 48px;
        letter-spacing: -0.03em;
        line-height: 1;
        margin-top: 6px;
      }
      .pass {
        margin: 6px 20px 0;
        background: var(--azul);
        color: #fff;
        border-radius: 14px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        position: relative;
      }
      .pass div {
        padding: 14px 12px;
        border-right: 2px dashed rgba(255, 255, 255, 0.35);
      }
      .pass div:last-child {
        border: 0;
      }
      .pass small {
        display: block;
        font-family: 'Archivo Narrow';
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.75;
      }
      .pass b {
        font-size: 30px;
        font-weight: 800;
      }
      .days {
        display: flex;
        gap: 6px;
        margin: 12px 20px 0;
      }
      .days span {
        flex: 1;
        height: 30px;
        border-radius: 6px;
        background: var(--fd);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .days .y {
        background: var(--azul);
        color: #fff;
      }
      .days .t {
        outline: 3px solid var(--amb);
      }
      .hd {
        display: grid;
        grid-template-columns: 64px 1fr 108px;
        padding: 18px 20px 8px;
        font-family: 'Archivo Narrow';
        font-weight: 700;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--apoio);
        border-bottom: 3px solid var(--azul);
      }
      .r {
        display: grid;
        grid-template-columns: 64px 1fr 108px;
        align-items: center;
        padding: 0 20px;
        min-height: 76px;
        border-bottom: 2px solid var(--fd);
      }
      .h {
        font-size: 22px;
        font-weight: 800;
      }
      .nm {
        font-weight: 700;
        font-size: 18px;
      }
      .ap {
        font-size: 13px;
        color: var(--apoio);
      }
      .s {
        height: 44px;
        border-radius: 8px;
        font-weight: 800;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--azul);
      }
      .s.ok {
        background: var(--vd);
        border-color: var(--vd);
        color: #fff;
      }
      .s.now {
        background: var(--amb);
        border-color: var(--amb);
      }
      .s.fol {
        border-style: dashed;
      }
      nav {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 76px;
        border-top: 2px solid var(--fd);
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        padding: 10px 12px 14px;
        gap: 6px;
      }
      nav a {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 13px;
        color: var(--apoio);
        border-radius: 8px;
      }
      nav a.on {
        background: var(--azul);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <p class="date">Domingo, 25 de outubro</p>
      <h1>Hoje</h1>
    </header>
    <div class="pass">
      <div><small>Semana</small><b>4/5</b></div>
      <div><small>Sequência</small><b>11</b></div>
      <div><small>Melhor</small><b>23</b></div>
    </div>
    <div class="days">
      <span class="y">S</span><span class="y">T</span><span>Q</span><span class="y">Q</span
      ><span class="y">S</span><span>S</span><span class="t">D</span>
    </div>
    <div class="hd"><span>Hora</span><span>Atividade</span><span>Estado</span></div>
    <div class="r">
      <span class="h">07:00</span>
      <div>
        <p class="nm">Caminhada</p>
        <p class="ap">32 min · meta 20</p>
      </div>
      <span class="s ok">Feito</span>
    </div>
    <div class="r">
      <span class="h">18:30</span>
      <div>
        <p class="nm">Alongamento</p>
        <p class="ap">10 min</p>
      </div>
      <span class="s now">Marcar</span>
    </div>
    <div class="r">
      <span class="h">20:00</span>
      <div>
        <p class="nm">Flexões</p>
        <p class="ap">3 de 4 nesta semana</p>
      </div>
      <span class="s fol">Folga</span>
    </div>
    <nav><a class="on">Hoje</a><a>Atividades</a><a>Semana</a><a>Ajustes</a></nav>
  </body>
</html>
