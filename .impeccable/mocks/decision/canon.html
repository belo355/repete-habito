<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 390px;
        height: 844px;
        overflow: hidden;
        background: #f3f4f6;
        color: #111827;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 22px 20px 10px;
      }
      .date {
        font-size: 14px;
        color: #6b7280;
        font-weight: 500;
      }
      h1 {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .card {
        background: #fff;
        margin: 10px 16px;
        border-radius: 16px;
        padding: 18px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .ring {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: conic-gradient(#16a34a 0 67%, #e5e7eb 67% 100%);
        display: grid;
        place-items: center;
      }
      .ring b {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        font-size: 20px;
      }
      .k {
        font-size: 15px;
        font-weight: 600;
      }
      .v {
        font-size: 13px;
        color: #6b7280;
        margin-top: 4px;
      }
      ul {
        list-style: none;
        background: #fff;
        margin: 6px 16px;
        border-radius: 16px;
        flex: 1;
        overflow: hidden;
      }
      li {
        display: flex;
        align-items: center;
        padding: 14px 16px;
        border-bottom: 1px solid #f0f1f3;
        min-height: 64px;
      }
      .n {
        font-size: 17px;
        font-weight: 600;
      }
      .s {
        font-size: 13px;
        color: #6b7280;
        margin-top: 2px;
      }
      .c {
        margin-left: auto;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid #d1d5db;
      }
      .c.on {
        background: #16a34a;
        border-color: #16a34a;
      }
      nav {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        height: 64px;
        background: #fff;
        font-size: 11px;
        color: #6b7280;
        margin-top: 8px;
      }
      nav a {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      nav .cur {
        color: #16a34a;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>
      <p class="date">sábado, 24 de outubro</p>
      <h1>Hoje</h1>
    </header>
    <div class="card">
      <div class="ring"><b>2/3</b></div>
      <div>
        <p class="k">Sequência de 12 dias</p>
        <p class="v">4 de 5 dias planejados nesta semana</p>
      </div>
    </div>
    <ul>
      <li>
        <div>
          <p class="n">Caminhada</p>
          <p class="s">32 min · meta 20</p>
        </div>
        <i class="c on"></i>
      </li>
      <li>
        <div>
          <p class="n">Flexões</p>
          <p class="s">faltam 2 nesta semana</p>
        </div>
        <i class="c"></i>
      </li>
      <li>
        <div>
          <p class="n">Alongamento</p>
          <p class="s">feito hoje</p>
        </div>
        <i class="c on"></i>
      </li>
      <li>
        <div>
          <p class="n">Mobilidade</p>
          <p class="s">folga hoje</p>
        </div>
        <i class="c"></i>
      </li>
    </ul>
    <nav>
      <a class="cur">Hoje</a><a>Atividades</a><a>Dashboard</a><a>Progresso</a><a>Ajustes</a>
    </nav>
  </body>
</html>
