name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint → typecheck → unit → build → e2e → lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (ESLint + fronteiras + Prettier)
        run: pnpm lint && pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + cobertura do domínio (≥ 90%)
        run: pnpm test --coverage

      - name: Unit nos 3 fusos
        run: pnpm test:tz

      - name: Build
        run: pnpm build

      - name: Instalar navegadores do Playwright
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E + axe
        run: pnpm e2e

      - name: Lighthouse CI
        run: pnpm lhci

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorios
          path: |
            coverage/
            playwright-report/
            .lighthouseci/
          retention-days: 14
