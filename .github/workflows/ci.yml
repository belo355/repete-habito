name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint → typecheck → unit → build → e2e → lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (ESLint + fronteiras + Prettier)
        run: pnpm lint && pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + cobertura do domínio (≥ 90%)
        run: pnpm test --coverage

      - name: Unit nos 3 fusos
        run: pnpm test:tz

      - name: Build
        run: pnpm build

      - name: Instalar navegadores do Playwright
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E + axe
        run: pnpm e2e

      - name: Lighthouse CI
        run: pnpm lhci

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorios
          path: |
            coverage/
            playwright-report/
            .lighthouseci/
          retention-days: 14

  deploy:
    name: Deploy (Cloudflare Pages)
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: pnpm/action-setup@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm install --frozen-lockfile && pnpm build

      # main → produção; PR → preview com URL própria (branch do PR).
      - name: Publicar
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=repete-habito --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Aviso de configuração
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Deploy ignorado. Configure os secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (ver README, seção Deploy)."
